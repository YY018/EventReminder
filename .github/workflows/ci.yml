name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: eventreminder
          POSTGRES_USER: eventreminder
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventreminder -d eventreminder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      APP_SECRET: ci-only-secret-0123456789-abcdefghijklmno
      DATABASE_URL: postgresql+psycopg://eventreminder:ci-only-password@localhost:5432/eventreminder
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Check migrations against PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests migrations
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
